# Deploys the live-coach Worker to Cloudflare on every push to main.
# The two Southlake-sourced documents come from repository secrets, never from the repo;
# the team-written sources are committed in worker/content/.
# Until CLOUDFLARE_API_TOKEN is added, this workflow does nothing.
name: Deploy coach worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip until Cloudflare is set up
        if: env.CF_TOKEN == ''
        run: echo "No CLOUDFLARE_API_TOKEN secret yet; skipping the worker deploy."

      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''

      - name: Write Southlake documents from secrets
        if: env.CF_TOKEN != ''
        env:
          COACHING: ${{ secrets.PHM_DOC_COACHING_THEMES }}
          TOOLS: ${{ secrets.PHM_DOC_TOOLS_INTRO }}
        run: |
          mkdir -p worker/content
          printf '%s' "$COACHING"    > worker/content/coaching_themes.md
          printf '%s' "$TOOLS"       > worker/content/tools_intro.md
          for f in worker/content/*.md; do test -s "$f" || { echo "Missing secret for $f"; exit 1; }; done

      - name: Deploy
        if: env.CF_TOKEN != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npx wrangler deploy
